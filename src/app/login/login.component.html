<div class="bigcontainer">
  <div class="container">
    <div class="left">
      <h1>Welcome to Student Ranking Dashboard</h1>
      <img src="login.png" alt="Student" />
    </div>
    <div class="right">
      <form>
        <img src="bannari.png" alt="Logo" class="logo" />
        <h2>LOGIN</h2>
        <label for="email">EMAIL ID:</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
        <label for="password">PASSWORD:</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
        <button type="submit" (click)="submit()">Sign in</button>
  
        <p style="text-align: center; margin: 5px 0">or</p>
  
        <!-- Google Sign-In Button -->
        <div
          id="g_id_onload"
          data-client_id="379314646189-c2g7n58i4uurga4ufsbphfff6r2d63fp.apps.googleusercontent.com"
          data-context="signin"
          data-ux_mode="popup"
          data-callback="handleOauthResponse"
          data-auto_prompt="false"
          style="width: 300px"
        ></div>
        <div
          class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="filled_white"
          data-text="signin_with"
          data-size="medium"
          data-logo_alignment="left"
          id="G-btn"
        ></div>
      </form>
    </div>
  </div>
</div>
