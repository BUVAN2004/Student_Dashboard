<div class="body">
    <div class="content-wrapper">
      <h3>STUDENT DETAILS</h3>
      <div class="search-container">
        <mat-form-field appearance="fill" class="form-field">
          <mat-label>Search by Registration Number</mat-label>
          <input
            matInput
            [(ngModel)]="searchTerm"
            placeholder="Enter reg number"
          />
        </mat-form-field>
        <button
          mat-raised-button
          (click)="searchByRegNo()"
          class="action-button"
        >
          Search
        </button>
      </div>

      <div class="filter-container">
        <mat-form-field appearance="fill" class="form-field">
          <mat-label>Min Ranking</mat-label>
          <input
            matInput
            [(ngModel)]="minRank"
            type="number"
            placeholder="Min ranking"
          />
        </mat-form-field>
        <mat-form-field appearance="fill" class="form-field">
          <mat-label>Max Ranking</mat-label>
          <input
            matInput
            [(ngModel)]="maxRank"
            type="number"
            placeholder="Max ranking"
          />
        </mat-form-field>
        <button
          mat-raised-button
          (click)="filterByRanking()"
          class="action-button"
        >
          Filter
        </button>
      </div>

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <!-- Registration Number Column -->
        <ng-container matColumnDef="RegNo">
          <th mat-header-cell *matHeaderCellDef>Registration Number</th>
          <td mat-cell *matCellDef="let student">{{ student.id }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="Name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let student">{{ student.name }}</td>
        </ng-container>

        <!-- Department Column -->
        <ng-container matColumnDef="Dept">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let student">{{ student.department }}</td>
        </ng-container>

        <!-- Score Column -->
        <ng-container matColumnDef="Score">
          <th mat-header-cell *matHeaderCellDef>Score</th>
          <td mat-cell *matCellDef="let student">{{ student.score }}</td>
        </ng-container>

        <!-- Rank Column -->
        <ng-container matColumnDef="rank">
          <th mat-header-cell *matHeaderCellDef >Rank</th>
          <td mat-cell *matCellDef="let student" >{{ student.placementRank }}</td>
        </ng-container>

        <!-- Department Rank Column -->
        <ng-container matColumnDef="DeptRank">
          <th mat-header-cell *matHeaderCellDef>Department Rank</th>
          <td mat-cell *matCellDef="let student">{{ student.deptRank }}</td>
        </ng-container>

        <!-- Table Header and Rows -->
        <tr
          mat-header-row
          *matHeaderRowDef="['RegNo', 'Name', 'Dept', 'Score', 'rank', 'DeptRank']"
        ></tr>
        <tr
          mat-row
          *matRowDef="
            let row;
            columns: ['RegNo', 'Name', 'Dept', 'Score', 'rank', 'DeptRank']
          "
        ></tr>
      </table>

      <mat-paginator
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        showFirstLastButtons
        class="paginator"
      ></mat-paginator>
    </div>
  </div>
